    <main class="cases-page">

        <h1>CONTRIBUTE INFORMATION</h1>

        <div class="case-card">

            <h2>Share Your Information</h2>

            <p>
                Do you have any information about a case?
                You can share it with us using the form below.
            </p>

            <form>

                <label>Your Name:</label>
                <br>
                <input type="text" name="username">
                <br><br>

                <label>Select a Case:</label>
                <br>
                <select name="case">
                    <option>The Shoreline Case</option>
                    <option>The Forgotten Witness</option>
                    <option>The Predicted Death</option>
                </select>
                <br><br>

                <label>Your Information:</label>
                <br>
                <textarea name="information" rows="5" cols="30"></textarea>
                <br><br>

                <input type="submit" value="Submit">

            </form>

        </div>

    </main>
